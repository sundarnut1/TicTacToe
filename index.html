<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Tic Tac Toe</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="script.js"></script>
</head>
<body>
    <div style="display: block;" id="divCanvas">
        <input type="text" name="txtCoord" id="txtCoord" /><br />
        <canvas id="t3Canvas" name="t3Canvas" width="300" height="350" />
    </div>
    <script lang="javascript">
        playGame();
    </script>
    <p>
    <img src="x.svg" width="1" height="1">

    <img src="o.filled.svg" width="1" height="1">
    <img src="hint.svg" width="1" height="1">
    <img src="hint.filled.svg" width="1" height="1">
    <img src="reset.svg" width="1" height="1">
    <img src="reset.filled.svg" width="1" height="1">

    <img src="quit.filled.svg" width="1" height="1">
